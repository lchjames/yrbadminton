<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>YR Badminton RSVP</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="rsvp-page">
  <main class="rsvp-shell">
    <header class="rsvp-hero">
      <div class="rsvp-brand">
        <div class="brand-mark" aria-hidden="true">YR</div>
        <div>
          <p class="rsvp-kicker">YR BADMINTON</p>
          <h1>打波登記 <span>RSVP</span></h1>
          <p class="rsvp-subtitle">Sunday badminton · Goodminton</p>
        </div>
      </div>
      <a class="rsvp-admin-link" href="/admin">Admin</a>
    </header>

    <section id="eventPanel" class="event-card">
      <div class="event-topline">
        <div>
          <span class="live-dot"></span>
          <span class="event-state">OPEN FOR RSVP</span>
        </div>
        <select id="sessionSelect" class="session-select" aria-label="選擇場次"></select>
      </div>

      <div class="event-main">
        <div class="date-tile" aria-hidden="true">
          <span id="eventMonth" class="date-month">---</span>
          <strong id="eventDay" class="date-day">--</strong>
          <span class="date-weekday">SUN</span>
        </div>

        <div class="event-details">
          <h2 id="eventTitle">YR Badminton</h2>
          <div class="event-meta">
            <div class="meta-item"><span class="meta-icon">◷</span><span id="eventTime">17:00–19:00</span></div>
            <div class="meta-item"><span class="meta-icon">⌖</span><span id="eventVenue">Goodminton</span></div>
          </div>
          <div id="sessionInfo" class="session-info sr-only"></div>
        </div>
      </div>

      <div class="capacity-block">
        <div class="capacity-copy">
          <span id="capacityText">Loading attendance…</span>
          <strong id="remainingText"></strong>
        </div>
        <div class="capacity-track" aria-hidden="true">
          <div id="capacityBar" class="capacity-fill" style="width:0%"></div>
        </div>
      </div>
    </section>

    <div class="rsvp-grid-layout">
      <section class="rsvp-form-card">
        <div class="card-heading">
          <div>
            <p class="section-kicker">YOUR RSVP</p>
            <h2>你今個星期嚟唔嚟？</h2>
          </div>
        </div>

        <form id="rsvpForm">
          <label class="field-label" for="name">姓名 / Name</label>
          <input id="name" class="rsvp-input" maxlength="80" autocomplete="name" required placeholder="Enter your name">

          <label class="field-label">狀態 / Status</label>
          <div class="status-selector" role="radiogroup" aria-label="RSVP status">
            <label class="status-option status-yes">
              <input type="radio" name="status" value="YES" checked>
              <span class="status-symbol">✓</span>
              <span><strong>YES</strong><small>我會嚟</small></span>
            </label>
            <label class="status-option status-maybe">
              <input type="radio" name="status" value="MAYBE">
              <span class="status-symbol">?</span>
              <span><strong>MAYBE</strong><small>未確定</small></span>
            </label>
            <label class="status-option status-no">
              <input type="radio" name="status" value="NO">
              <span class="status-symbol">×</span>
              <span><strong>NO</strong><small>今次唔嚟</small></span>
            </label>
          </div>

          <div id="statusWarning" class="warning hidden"></div>

          <div class="rsvp-form-row">
            <div>
              <label class="field-label" for="pax">人數 / Players</label>
              <div class="number-field">
                <button id="paxMinus" class="number-btn" type="button" aria-label="Decrease players">−</button>
                <input id="pax" type="number" min="1" max="20" value="1" inputmode="numeric">
                <button id="paxPlus" class="number-btn" type="button" aria-label="Increase players">+</button>
              </div>
            </div>
            <div>
              <label class="field-label" for="note">備註 / Note</label>
              <input id="note" class="rsvp-input" maxlength="300" placeholder="Optional">
            </div>
          </div>

          <button id="submitBtn" class="primary-rsvp-btn" type="submit">
            <span>確認登記</span>
            <span aria-hidden="true">→</span>
          </button>

          <button id="cancelBtn" class="cancel-rsvp-btn" type="button">取消之前嘅出席 / Change to NO</button>
          <div id="msg" class="rsvp-message" role="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="attendance-card">
        <div class="card-heading attendance-heading">
          <div>
            <p class="section-kicker">WHO'S IN</p>
            <h2>目前出席</h2>
          </div>
          <button id="refreshBtn" class="round-refresh" type="button" aria-label="Refresh attendee list">↻</button>
        </div>

        <div id="summary" class="attendance-summary"></div>
        <div id="list" class="attendee-list user-attendee-list"></div>
      </section>
    </div>

    <footer class="rsvp-footer">YR Badminton · Sunday 17:00–19:00</footer>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
